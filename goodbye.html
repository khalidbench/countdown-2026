<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goodbye</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #05060f;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #eef1ff;
    --muted: #8a90b8;
    --accent: #7c6bff;
    --accent2: #22d3ee;
    --glow: rgba(124, 107, 255, 0.45);
    --error: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: 0;
    background:
      radial-gradient(40% 35% at 25% 30%, rgba(124, 107, 255, 0.14), transparent 70%),
      radial-gradient(35% 30% at 75% 65%, rgba(34, 211, 238, 0.10), transparent 70%);
    animation: drift 24s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes drift {
    from { transform: translate(-2%, -2%) scale(1); }
    to   { transform: translate(2%, 2%) scale(1.08); }
  }

  /* ---------- unlock screen ---------- */
  #lock {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .lock-card {
    width: min(420px, 100%);
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: 42px 30px 36px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 60px rgba(0, 0, 0, 0.5);
  }
  .lock-icon {
    font-size: 34px;
    display: block;
    margin-bottom: 14px;
    filter: drop-shadow(0 0 12px var(--glow));
  }
  .lock-card h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, #ffffff, var(--accent) 60%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .lock-card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 26px;
  }
  .pw-row { display: flex; gap: 10px; }
  #pw {
    flex: 1;
    min-width: 0;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    padding: 13px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #pw:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 107, 255, 0.2); }
  #unlock-btn {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    color: #0b0d1a;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 22px;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
  }
  #unlock-btn:hover { filter: brightness(1.1); }
  #unlock-btn:active { transform: scale(0.97); }
  #unlock-btn:disabled { opacity: 0.6; cursor: wait; }
  #lock-msg {
    min-height: 22px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  #lock-msg.error { color: var(--error); }
  .back-link {
    display: inline-block;
    margin-top: 22px;
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .back-link:hover { color: var(--text); border-bottom-color: var(--muted); }

  /* ---------- letter view ---------- */
  #reader { position: relative; z-index: 1; display: none; padding: 48px 18px 80px; }
  .reader-inner { max-width: 680px; margin: 0 auto; }
  .reader-head { text-align: center; margin-bottom: 34px; }
  .reader-head h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 800;
    background: linear-gradient(90deg, #ffffff, var(--accent) 60%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .reader-head p { color: var(--muted); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; }
  .langs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 26px 0 38px;
  }
  .langs button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 99px;
    color: var(--muted);
    font-size: 13px;
    padding: 9px 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .langs button:hover { color: var(--text); }
  .langs button.active {
    color: #0b0d1a;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-color: transparent;
  }
  .letter {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: clamp(28px, 6vw, 56px);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 60px rgba(0, 0, 0, 0.45);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(16px, 2.2vw, 18px);
    line-height: 1.85;
  }
  .letter p { margin-bottom: 1.3em; }
  .letter p:last-child { margin-bottom: 0; }
  .letter p.signature { margin-top: 2em; margin-bottom: 0; }
  .reader-foot { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="aurora"></div>

<section id="lock">
  <div class="lock-card">
    <span class="lock-icon">🔒</span>
    <h1>Goodbye</h1>
    <p>This page is private. The content is encrypted,<br>and only the right password can reveal it.</p>
    <form id="lock-form" class="pw-row" autocomplete="off">
      <input type="password" id="pw" placeholder="Password" autocomplete="off" autofocus>
      <button type="submit" id="unlock-btn">Open</button>
    </form>
    <div id="lock-msg"></div>
    <a class="back-link" href="./">← Back to the countdown</a>
  </div>
</section>

<section id="reader">
  <div class="reader-inner">
    <div class="reader-head">
      <h1 id="reader-title">Goodbye</h1>
      <p>October 22, 2026</p>
    </div>
    <div class="langs">
      <button data-lang="en">English</button>
      <button data-lang="fr">Français</button>
      <button data-lang="de">Deutsch</button>
    </div>
    <article class="letter" id="letter"></article>
    <div class="reader-foot">
      <a class="back-link" href="./">← Back to the countdown</a>
    </div>
  </div>
</section>

  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let letters = null;

  async function decrypt(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(BLOB.salt), iterations: BLOB.iter, hash: "SHA-256" },
      keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function renderLetter(lang) {
    const text = letters[lang] || "";
    const paragraphs = text.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    const article = $("letter");
    article.innerHTML = "";
    paragraphs.forEach((p, i) => {
      const el = document.createElement("p");
      el.textContent = p.replace(/\n/g, " ");
      if (i >= paragraphs.length - 2) el.className = "signature";
      article.appendChild(el);
    });
    document.querySelectorAll(".langs button").forEach((b) =>
      b.classList.toggle("active", b.dataset.lang === lang));
  }

  document.querySelectorAll(".langs button").forEach((b) =>
    b.addEventListener("click", () => renderLetter(b.dataset.lang)));

  $("lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("pw").value;
    if (!pw) return;
    const btn = $("unlock-btn");
    const msg = $("lock-msg");
    if (!window.crypto || !window.crypto.subtle) {
      msg.className = "error";
      msg.textContent = "This browser can't decrypt here. Open the page over https.";
      return;
    }
    btn.disabled = true;
    msg.className = "";
    msg.textContent = "Decrypting…";
    try {
      letters = await decrypt(pw);
      $("lock").style.display = "none";
      $("reader").style.display = "block";
      renderLetter("en");
    } catch (_) {
      msg.className = "error";
      msg.textContent = "Wrong password. The content stays locked.";
      $("pw").value = "";
      $("pw").focus();
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
